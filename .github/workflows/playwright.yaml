```yaml
name: Playwright Tests

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Select environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - dev
          - qa
          - preprod
          - uat

      test_suite:
        description: 'Select test suite'
        required: true
        default: 'all'
        type: choice
        options:
          - sanity
          - regression
          - all

      browser:
        description: 'Select browser'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all

jobs:
  playwright-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        env:
          TEST_ENV: ${{ inputs.environment || 'qa' }}
          TEST_SUITE: ${{ inputs.test_suite || 'all' }}
          BROWSER_INPUT: ${{ inputs.browser || 'all' }}

        run: |
          echo "Environment: $TEST_ENV"
          echo "Test Suite: $TEST_SUITE"
          echo "Browser: $BROWSER_INPUT"

          if [ "$BROWSER_INPUT" = "all" ]; then
            BROWSER=""
          else
            BROWSER="--project=$BROWSER_INPUT"
          fi

          if [ "$TEST_SUITE" = "sanity" ]; then
            npx playwright test --grep @sanity $BROWSER

          elif [ "$TEST_SUITE" = "regression" ]; then
            npx playwright test --grep @regression $BROWSER

          else
            npx playwright test $BROWSER
          fi

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
```
