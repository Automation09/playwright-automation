name: Playwright Tests (Docker)

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:
    inputs:
      environment:
        description: 'Select environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - dev
          - qa
          - preprod
          - uat

      test_suite:
        description: 'Select test suite'
        required: true
        default: 'all'
        type: choice
        options:
          - sanity
          - regression
          - all

      browser:
        description: 'Select browser'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all

jobs:
  playwright-docker-tests:
    runs-on: ubuntu-latest

    # GitHub Environment scoping for credentials
    environment: ${{ inputs.environment || 'qa' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Playwright Docker Image
        run: docker build -t playwright-runner .

      - name: Run Playwright Tests inside Docker
        env:
          TEST_ENV: ${{ inputs.environment || 'qa' }}
          TEST_SUITE: ${{ inputs.test_suite || 'all' }}
          BROWSER_INPUT: ${{ inputs.browser || 'all' }}
          TEST_USER: ${{ secrets.TEST_USERNAME }}
          TEST_PASS: ${{ secrets.TEST_PASSWORD }}
        run: |
          echo "Environment: $TEST_ENV"
          echo "Test Suite: $TEST_SUITE"
          echo "Browser: $BROWSER_INPUT"

          # Determine browser flag
          if [ "$BROWSER_INPUT" = "all" ]; then
            BROWSER_FLAG=""
          else
            BROWSER_FLAG="--project=$BROWSER_INPUT"
          fi

          # Determine grep tag flag
          if [ "$TEST_SUITE" = "sanity" ]; then
            TAG_FLAG="--grep @sanity"
          elif [ "$TEST_SUITE" = "regression" ]; then
            TAG_FLAG="--grep @regression"
          else
            TAG_FLAG=""
          fi

          # Execute inside container and mount local report folders
          docker run --rm \
            -e TEST_ENV="$TEST_ENV" \
            -e TEST_USER="$TEST_USER" \
            -e TEST_PASS="$TEST_PASS" \
            -v ${{ github.workspace }}/playwright-report:/app/playwright-report \
            -v ${{ github.workspace }}/test-results:/app/test-results \
            playwright-runner \
            npx playwright test $TAG_FLAG $BROWSER_FLAG

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7