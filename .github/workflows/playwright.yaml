name: Playwright Tests (Docker + GitHub Pages)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - dev
          - qa
          - preprod
          - uat
      test_suite:
        description: 'Select test suite'
        required: true
        default: 'all'
        type: choice
        options:
          - sanity
          - regression
          - all
      browser:
        description: 'Select browser'
        required: true
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all

# Required permissions for deploying directly to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  playwright-docker-tests:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'qa' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Playwright Docker Image
        run: docker build -t playwright-runner .

      - name: Run Playwright Tests inside Docker
        env:
          TEST_ENV: ${{ inputs.environment || 'qa' }}
          TEST_SUITE: ${{ inputs.test_suite || 'all' }}
          BROWSER_INPUT: ${{ inputs.browser || 'all' }}
          TEST_USER: ${{ secrets.TEST_USERNAME }}
          TEST_PASS: ${{ secrets.TEST_PASSWORD }}
        run: |
          echo "Environment: $TEST_ENV"
          echo "Test Suite: $TEST_SUITE"
          echo "Browser: $BROWSER_INPUT"

          if [ "$BROWSER_INPUT" = "all" ]; then
            BROWSER_FLAG=""
          else
            BROWSER_FLAG="--project=$BROWSER_INPUT"
          fi

          if [ "$TEST_SUITE" = "sanity" ]; then
            TAG_FLAG="--grep @sanity"
          elif [ "$TEST_SUITE" = "regression" ]; then
            TAG_FLAG="--grep @regression"
          else
            TAG_FLAG=""
          fi

          # Execute inside container and mount local report folder
          docker run --rm \
            -e TEST_ENV="$TEST_ENV" \
            -e TEST_USER="$TEST_USER" \
            -e TEST_PASS="$TEST_PASS" \
            -v ${{ github.workspace }}/playwright-report:/app/playwright-report \
            -v ${{ github.workspace }}/test-results:/app/test-results \
            playwright-runner \
            npx playwright test $TAG_FLAG $BROWSER_FLAG

      # --- GitHub Pages Deployment Steps ---
      - name: Setup Pages
        if: always()
        uses: actions/configure-pages@v5

      - name: Upload Artifact to Pages
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

      - name: Deploy to GitHub Pages
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4

      # Backup downloadable zip artifact in GitHub Actions
      - name: Upload Playwright Artifact Backup
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7