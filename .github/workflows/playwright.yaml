name: Playwright Tests (GHCR + Parallel Matrix + Pages)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - dev
          - qa
          - preprod
          - uat
      test_suite:
        description: 'Select test suite'
        required: true
        default: 'all'
        type: choice
        options:
          - sanity
          - regression
          - all

permissions:
  contents: read
  packages: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  # Image name formatted in lowercase (required by Docker/GHCR)
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/playwright-runner:latest

jobs:
  # -------------------------------------------------------------------
  # Job 1: Build & Cache Docker image in GHCR (runs once)
  # -------------------------------------------------------------------
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Uses GitHub Actions cache so repeated builds are near-instant
      - name: Build and Push Docker image to GHCR
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE_NAME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------------
  # Job 2: Run Tests across Browsers in Parallel using Pre-built Image
  # -------------------------------------------------------------------
  test-matrix:
    needs: [build-and-push-image]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'qa' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Pre-built Image
        run: docker pull ${{ env.IMAGE_NAME }}

      - name: Run Tests on ${{ matrix.browser }}
        env:
          TEST_ENV: ${{ inputs.environment || 'qa' }}
          TEST_SUITE: ${{ inputs.test_suite || 'all' }}
          TEST_USER: ${{ secrets.TEST_USERNAME }}
          TEST_PASS: ${{ secrets.TEST_PASSWORD }}
        run: |
          echo "Executing tests on ${{ matrix.browser }}"

          if [ "$TEST_SUITE" = "sanity" ]; then
            TAG_FLAG="--grep @sanity"
          elif [ "$TEST_SUITE" = "regression" ]; then
            TAG_FLAG="--grep @regression"
          else
            TAG_FLAG=""
          fi

          docker run --rm \
            -e TEST_ENV="$TEST_ENV" \
            -e TEST_USER="$TEST_USER" \
            -e TEST_PASS="$TEST_PASS" \
            -v ${{ github.workspace }}/playwright-report:/app/playwright-report \
            -v ${{ github.workspace }}/blob-report:/app/blob-report \
            ${{ env.IMAGE_NAME }} \
            npx playwright test $TAG_FLAG --project=${{ matrix.browser }} --reporter=blob

      - name: Upload Blob Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-blob-reports-${{ matrix.browser }}
          path: blob-report/
          retention-days: 1

  # -------------------------------------------------------------------
  # Job 3: Merge and Deploy Combined Report to GitHub Pages
  # -------------------------------------------------------------------
  merge-reports-and-deploy:
    if: always()
    needs: [test-matrix]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright for Merging
        run: npm ci

      - name: Download All Blob Reports
        uses: actions/download-artifact@v4
        with:
          path: all-blobs/
          pattern: all-blob-reports-*
          merge-multiple: true

      - name: Merge Reports into HTML
        run: npx playwright merge-reports --reporter html ./all-blobs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4