name: Playwright Tests (Native Runners + Parallel Matrix + Pages)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Select environment'
        required: true
        default: 'qa'
        type: choice
        options:
          - dev
          - qa
          - preprod
          - uat
      test_suite:
        description: 'Select test suite'
        required: true
        default: 'all'
        type: choice
        options:
          - sanity
          - regression
          - api
          - all

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------------
  # Job 1: Run API Tests ONCE (Headless Node.js, No Browsers)
  # -------------------------------------------------------------------
  test-api:
    if: inputs.test_suite == 'all' || inputs.test_suite == 'regression' || inputs.test_suite == 'api' || github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'qa' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run API Tests
        env:
          TEST_ENV: ${{ inputs.environment || 'qa' }}
        run: |
          echo "Executing API tests on Node.js runner"
          npx playwright test --project=api

      - name: Upload API Blob Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-blob-reports-api
          path: blob-report/
          retention-days: 1

  # -------------------------------------------------------------------
  # Job 2: Run UI Tests across Browsers in Parallel
  # -------------------------------------------------------------------
  test-matrix:
    if: inputs.test_suite != 'api'
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'qa' }}
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright Browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}-${{ matrix.browser }}

      - name: Install Playwright Browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Install Browser Dependencies Only (On Cache Hit)
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps ${{ matrix.browser }}

      - name: Run UI Tests on ${{ matrix.browser }}
        env:
          TEST_ENV: ${{ inputs.environment || 'qa' }}
          TEST_SUITE: ${{ inputs.test_suite || 'all' }}
          TEST_USER: ${{ secrets.TEST_USERNAME }}
          TEST_PASS: ${{ secrets.TEST_PASSWORD }}
        run: |
          echo "Executing UI tests on ${{ matrix.browser }}"

          if [ "$TEST_SUITE" = "sanity" ]; then
            TAG_FLAG="--grep @sanity"
          elif [ "$TEST_SUITE" = "regression" ]; then
            TAG_FLAG="--grep @regression"
          else
            TAG_FLAG=""
          fi

          npx playwright test $TAG_FLAG --project=${{ matrix.browser }}

      - name: Upload UI Matrix Blob Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: all-blob-reports-${{ matrix.browser }}
          path: blob-report/
          retention-days: 1

  # -------------------------------------------------------------------
  # Job 3: Merge Both API & UI Reports, Deploy to GitHub Pages
  # -------------------------------------------------------------------
  merge-reports-and-deploy:
    if: always()
    needs: [test-api, test-matrix]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download All Blob Reports (UI + API)
        uses: actions/download-artifact@v4
        with:
          path: all-blobs/
          pattern: all-blob-reports-*
          merge-multiple: true

      - name: Merge Reports into HTML
        run: npx playwright merge-reports --reporter html ./all-blobs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4