name: Daily Sanity Tests

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sanity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run sanity tests
        env:
          TEST_ENV: qa
        run: npx playwright test --grep @sanity --project=${{ matrix.browser }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanity-results-${{ matrix.browser }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  notify:
    if: always()
    needs: sanity
    runs-on: ubuntu-latest
    steps:
      - name: Email workflow result
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: ${{ secrets.MAIL_USERNAME }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          subject: Daily sanity tests - ${{ needs.sanity.result }}
          body: |
            Daily sanity workflow result: ${{ needs.sanity.result }}
            Run details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}