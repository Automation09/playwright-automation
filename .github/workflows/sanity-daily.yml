name: Daily Sanity Tests

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sanity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run sanity tests
        env:
          TEST_ENV: qa
        run: npx playwright test --grep @sanity --project=${{ matrix.browser }}

      - name: Upload Playwright blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanity-blob-${{ matrix.browser }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 1

  publish-report:
    if: always()
    needs: sanity
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download browser reports
        uses: actions/download-artifact@v4
        with:
          path: all-blobs/
          pattern: sanity-blob-*
          merge-multiple: true

      - name: Merge Playwright reports
        run: npx playwright merge-reports --reporter html ./all-blobs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

      - name: Deploy report to Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    if: always()
    needs: [sanity, publish-report]
    runs-on: ubuntu-latest
    steps:
      - name: Email workflow result
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: ${{ secrets.MAIL_USERNAME }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          subject: Daily sanity tests - ${{ needs.sanity.result }}
          body: |
            Daily sanity workflow result: ${{ needs.sanity.result }}
            Playwright HTML report: ${{ needs.publish-report.outputs.page_url }}
            Run details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}