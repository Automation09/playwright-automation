name: Daily Sanity Tests

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  sanity:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run sanity tests
        env:
          TEST_ENV: qa
        run: npx playwright test --grep @sanity --project=${{ matrix.browser }}

      - name: Upload Playwright blob report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanity-blob-${{ matrix.browser }}
          path: blob-report/
          if-no-files-found: ignore
          retention-days: 1

      - name: Upload test result summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sanity-results-${{ matrix.browser }}
          path: test-results/results.json
          if-no-files-found: ignore
          retention-days: 1

  publish-report:
    if: always()
    needs: sanity
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download browser reports
        uses: actions/download-artifact@v4
        with:
          path: all-blobs/
          pattern: sanity-blob-*
          merge-multiple: true

      - name: Merge Playwright reports
        run: npx playwright merge-reports --reporter html ./all-blobs

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

      - name: Deploy report to Pages
        id: deployment
        uses: actions/deploy-pages@v4

  notify:
    if: always()
    needs: [sanity, publish-report]
    runs-on: ubuntu-latest
    steps:
      - name: Download browser test summaries
        if: always()
        uses: actions/download-artifact@v4
        with:
          path: all-results/
          pattern: sanity-results-*
          if-no-artifact-found: ignore

      - name: Build email results table
        if: always()
        id: email-summary
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const browsers = ['chromium', 'firefox', 'webkit'];
          const rows = browsers.map((browser) => {
            const resultPath = path.join('all-results', `sanity-results-${browser}`, 'results.json');
            if (!fs.existsSync(resultPath)) {
              return `<tr><td>${browser}</td><td colspan="4">Results unavailable</td></tr>`;
            }

            const stats = JSON.parse(fs.readFileSync(resultPath, 'utf8')).stats ?? {};
            return `<tr><td>${browser}</td><td>${stats.expected ?? 0}</td><td>${stats.unexpected ?? 0}</td><td>${stats.flaky ?? 0}</td><td>${stats.skipped ?? 0}</td></tr>`;
          });
          const table = `<table style="border-collapse:collapse;font-family:Arial,sans-serif;font-size:14px"><thead><tr><th style="padding:8px;border:1px solid #ccc;text-align:left">Browser</th><th style="padding:8px;border:1px solid #ccc">Passed</th><th style="padding:8px;border:1px solid #ccc">Failed</th><th style="padding:8px;border:1px solid #ccc">Flaky</th><th style="padding:8px;border:1px solid #ccc">Skipped</th></tr></thead><tbody>${rows.join('')}</tbody></table>`;
          const delimiter = `EMAIL_TABLE_${require('node:crypto').randomUUID()}`;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `table<<${delimiter}\n${table}\n${delimiter}\n`);
          NODE

      - name: Email workflow result
        if: always()
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: ${{ secrets.MAIL_USERNAME }}
          to: ${{ secrets.NOTIFY_EMAIL }}
          subject: Daily sanity tests - ${{ needs.sanity.result }}
          body: |
            Daily sanity workflow result: ${{ needs.sanity.result }}
            Playwright HTML report: ${{ needs.publish-report.outputs.page_url }}
            Run details: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          html_body: |
            <html><body style="font-family:Arial,sans-serif;color:#222">
            <h2>Daily sanity test results</h2>
            <p><strong>Overall status:</strong> ${{ needs.sanity.result }}</p>
            ${{ steps.email-summary.outputs.table }}
            <p><a href="${{ needs.publish-report.outputs.page_url }}" style="display:inline-block;padding:10px 16px;background:#1769aa;color:#fff;text-decoration:none;border-radius:4px">Open Playwright report</a></p>
            <p><a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">View GitHub Actions run</a></p>
            </body></html>